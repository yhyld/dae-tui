name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      # The race detector guards the config/i18n shared-state contracts:
      # background token refreshes save the whole config while the UI
      # mutates preference fields, so every field write must take the lock.
      - name: Test (race)
        run: go test -race ./...
